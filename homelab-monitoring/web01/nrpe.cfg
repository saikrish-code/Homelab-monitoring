log_facility=daemon
pid_file=/tmp/nrpe.pid
server_port=5666
nrpe_user=nagios
nrpe_group=nagios
allowed_hosts=127.0.0.1,172.20.0.0/24
dont_blame_nrpe=0
command_timeout=60
connection_timeout=300

command[check_load]=/usr/lib/nagios/plugins/check_load -r -w 1.5,1.2,1.0 -c 2.5,2.0,1.5
command[check_disk_root]=/usr/lib/nagios/plugins/check_disk -w 10% -c 5% -p /
command[check_disk_data]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /data
command[check_total_procs]=/usr/lib/nagios/plugins/check_procs -w 250 -c 400
command[check_nginx_proc]=/usr/lib/nagios/plugins/check_procs -c 1: -C nginx
