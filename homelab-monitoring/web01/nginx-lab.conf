server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web01"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
