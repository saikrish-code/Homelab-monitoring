[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nrpe]
command=/usr/sbin/nrpe -c /etc/nagios/nrpe.cfg -f
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Official entrypoint handles first-run initialisation, then execs mariadbd.
# autorestart=false on purpose so a killed database stays down for the drill.
[program:mariadb]
command=docker-entrypoint.sh mariadbd
autorestart=false
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
