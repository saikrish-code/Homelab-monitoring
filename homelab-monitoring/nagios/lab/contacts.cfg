define contact {
    contact_name                  nagiosadmin
    alias                         Lab Administrator
    email                         admin@lab.local
    service_notification_period   24x7
    host_notification_period      24x7
    service_notification_options  w,u,c,r
    host_notification_options     d,u,r
    service_notification_commands notify-service-email,notify-service-snow
    host_notification_commands    notify-host-email,notify-host-snow
}

define contactgroup {
    contactgroup_name lab-admins
    alias             Lab Admins
    members           nagiosadmin
}
