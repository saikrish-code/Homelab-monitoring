# Lab-friendly timings: 1-minute checks, HARD state after 2 failed attempts
define host {
    name                    lab-host
    check_command           check-host-alive
    max_check_attempts      2
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_period     24x7
    notification_interval   30
    notification_options    d,u,r
    contact_groups          lab-admins
    notifications_enabled   1
    register                0
}

define service {
    name                    lab-service
    max_check_attempts      2
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_period     24x7
    notification_interval   30
    notification_options    w,u,c,r
    contact_groups          lab-admins
    notifications_enabled   1
    active_checks_enabled   1
    register                0
}
