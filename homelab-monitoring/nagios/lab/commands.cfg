# ---- Check commands ---------------------------------------------------------
define command {
    command_name check-host-alive
    command_line $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 2
}
define command {
    command_name check_http_path
    command_line $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u $ARG1$ -t 10
}
define command {
    command_name check_json_health
    command_line $USER1$/check_json_status.py -u http://$HOSTADDRESS$/health
}
define command {
    command_name check_nrpe
    command_line $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$ -t 20
}
define command {
    command_name check_mysql_basic
    command_line $USER1$/check_mysql -H $HOSTADDRESS$ -u nagios -p $USER2$
}
define command {
    command_name check_mysql_rows
    command_line $USER1$/check_mysql_query -H $HOSTADDRESS$ -u nagios -p $USER2$ -d labdb -q "SELECT COUNT(*) FROM customers" -w 3: -c 1:
}

# ---- Notification commands --------------------------------------------------
define command {
    command_name notify-host-email
    command_line /usr/bin/python3 /opt/lab/notify_email.py --kind=host --type="$NOTIFICATIONTYPE$" --host="$HOSTNAME$" --address="$HOSTADDRESS$" --state="$HOSTSTATE$" --output="$HOSTOUTPUT$" --to="$CONTACTEMAIL$" --datetime="$LONGDATETIME$"
}
define command {
    command_name notify-service-email
    command_line /usr/bin/python3 /opt/lab/notify_email.py --kind=service --type="$NOTIFICATIONTYPE$" --host="$HOSTNAME$" --address="$HOSTADDRESS$" --service="$SERVICEDESC$" --state="$SERVICESTATE$" --output="$SERVICEOUTPUT$" --to="$CONTACTEMAIL$" --datetime="$LONGDATETIME$"
}
define command {
    command_name notify-host-snow
    command_line /usr/bin/python3 /opt/lab/snow_incident.py --kind=host --type="$NOTIFICATIONTYPE$" --host="$HOSTNAME$" --address="$HOSTADDRESS$" --state="$HOSTSTATE$" --output="$HOSTOUTPUT$"
}
define command {
    command_name notify-service-snow
    command_line /usr/bin/python3 /opt/lab/snow_incident.py --kind=service --type="$NOTIFICATIONTYPE$" --host="$HOSTNAME$" --address="$HOSTADDRESS$" --service="$SERVICEDESC$" --state="$SERVICESTATE$" --output="$SERVICEOUTPUT$"
}
